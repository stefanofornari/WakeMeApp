# java.util.logging configuration of WakeMeApp.
#
# JUL reads it by itself when the JVM is started with
#     -Djava.util.logging.config.file=<path to this file>
# (set in the pom for javafx:run and for the tests; the packaging must pass it too).
#
# This is the whole configuration; the only thing done in code (ste.wakemeapp.log.LogSetup) is the
# level of ste.wakemeapp, which becomes FINE with --debug.

handlers = ste.wakemeapp.log.StdoutHandler, ste.lazyjava.logging.FileLogHandler

# Libraries log at INFO and above; the application's own loggers (ste.wakemeapp.*) have their level below
.level = INFO
ste.wakemeapp.level = INFO

# One line per message; handlers let everything through, the loggers decide the level
# The console is stdout (the JUL ConsoleHandler would use stderr, which runners show as warnings)
ste.wakemeapp.log.StdoutHandler.formatter = ste.wakemeapp.log.LineFormatter
ste.wakemeapp.log.StdoutHandler.level = ALL

# LazyJava's FileLogHandler: the log goes to the application data directory of the platform
# (${dataDir}, found from the application name); the folder is created if missing.
ste.lazyjava.logging.FileLogHandler.application = WakeMeApp
ste.lazyjava.logging.FileLogHandler.pattern = ${dataDir}/logs/wakemeapp.%g.log
ste.lazyjava.logging.FileLogHandler.formatter = ste.wakemeapp.log.LineFormatter
ste.lazyjava.logging.FileLogHandler.level = ALL
ste.lazyjava.logging.FileLogHandler.encoding = UTF-8
ste.lazyjava.logging.FileLogHandler.append = true
# The log never grows indefinitely: 3 files of at most 1 MB each
ste.lazyjava.logging.FileLogHandler.limit = 1000000
ste.lazyjava.logging.FileLogHandler.count = 3
