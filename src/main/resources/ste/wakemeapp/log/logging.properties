# java.util.logging configuration of WakeMeApp.
#
# JUL reads it by itself when the JVM is started with
#     -Djava.util.logging.config.file=<path to this file>
# (set in the pom for javafx:run and for the tests; the packaging must pass it too).
#
# This is the whole configuration; the only thing done in code (ste.wakemeapp.log.LogSetup) is the
# level of ste.wakemeapp, which becomes FINE with --debug.

handlers = java.util.logging.ConsoleHandler, ste.wakemeapp.log.AppFileHandler

# Libraries log at INFO and above; the application's own loggers (ste.wakemeapp.*) have their level below
.level = INFO
ste.wakemeapp.level = INFO

# One line per message; handlers let everything through, the loggers decide the level
java.util.logging.ConsoleHandler.formatter = ste.wakemeapp.log.LineFormatter
java.util.logging.ConsoleHandler.level = ALL

# A FileHandler whose pattern understands ${name}: a system property, or app.data.dir, the application
# data directory of the platform (override it with -Dapp.data.dir=...). The folder is created if missing.
ste.wakemeapp.log.AppFileHandler.pattern = ${app.data.dir}/logs/wakemeapp.%g.log
ste.wakemeapp.log.AppFileHandler.formatter = ste.wakemeapp.log.LineFormatter
ste.wakemeapp.log.AppFileHandler.level = ALL
ste.wakemeapp.log.AppFileHandler.encoding = UTF-8
ste.wakemeapp.log.AppFileHandler.append = true
# The log never grows indefinitely: 3 files of at most 1 MB each
ste.wakemeapp.log.AppFileHandler.limit = 1000000
ste.wakemeapp.log.AppFileHandler.count = 3
