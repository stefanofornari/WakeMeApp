# java.util.logging configuration of WakeMeApp, read by ste.wakemeapp.log.LogSetup at startup.
#
# Two things are not here because they are only known at startup, and LogSetup adds them:
#   - java.util.logging.FileHandler.pattern: the log folder is the "logs" folder in the
#     application data directory of the platform
#   - ste.wakemeapp.level is FINE instead of INFO when the application starts with --debug
# When the log folder cannot be used, LogSetup removes the FileHandler from "handlers".

handlers = java.util.logging.FileHandler,java.util.logging.ConsoleHandler

# Libraries log at INFO and above; the application's own loggers (ste.wakemeapp.*) have their level below
.level = INFO
ste.wakemeapp.level = INFO

# One line per message; handlers let everything through, the loggers decide the level
java.util.logging.FileHandler.formatter = ste.wakemeapp.log.LineFormatter
java.util.logging.FileHandler.level = ALL
java.util.logging.FileHandler.encoding = UTF-8
java.util.logging.FileHandler.append = true
# The log never grows indefinitely: 3 files of at most 1 MB each
java.util.logging.FileHandler.limit = 1000000
java.util.logging.FileHandler.count = 3

java.util.logging.ConsoleHandler.formatter = ste.wakemeapp.log.LineFormatter
java.util.logging.ConsoleHandler.level = ALL
